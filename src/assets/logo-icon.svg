<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="256" height="256">
  <!-- Outer Dark Circular Badge -->
  <circle cx="60" cy="60" r="56" fill="#0E131F" stroke="#F2A93B" stroke-width="2.5" />
  
  <!-- Notebook Back Layer Shadow -->
  <rect x="46" y="26" width="46" height="66" rx="8" fill="#F2A93B" opacity="0.35" transform="rotate(5 69 59)" />
  
  <!-- Main Notebook Cover -->
  <rect x="38" y="24" width="48" height="68" rx="8" fill="#0E131F" stroke="#F2A93B" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Left Binder Rings -->
  <path d="M30 38 h12 M30 58 h12 M30 78 h12" stroke="#F2A93B" stroke-width="5" stroke-linecap="round" />
  
  <!-- Code Bracket </ > Symbol -->
  <!-- Opening < -->
  <path d="M52 46 L45 53 L52 60" fill="none" stroke="#5EEAD4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Slash / -->
  <path d="M63 43 L57 63" fill="none" stroke="#5EEAD4" stroke-width="4.5" stroke-linecap="round" />
  <!-- Closing > -->
  <path d="M68 46 L75 53 L68 60" fill="none" stroke="#5EEAD4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Code Line Accents below bracket -->
  <line x1="48" y1="71" x2="74" y2="71" stroke="#5EEAD4" stroke-width="4" stroke-linecap="round" />
  <line x1="48" y1="79" x2="66" y2="79" stroke="#F2A93B" stroke-width="4" stroke-linecap="round" />
</svg>
